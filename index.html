<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo completo de medicamentos da Hórus. Pesquise por nome, código ou categoria.">
    <meta name="theme-color" content="#1a73e8">
    <title>Hórus Medicamentos 🏥</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="app-container">
        <header class="app-header glass">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-notes-medical"></i>
                    </div>
                    <div class="logo-text">
                        <h1>Hórus</h1>
                        <span class="subtitle">Medicamentos</span>
                    </div>
                </div>
                
                <div class="search-bar-container">
                    <div class="search-input-wrapper glass-input">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="searchInput" placeholder="Busque por nome, código..." aria-label="Pesquisar medicamento">
                    </div>
                    <div class="filter-wrapper">
                        <div class="select-container glass-input">
                            <i class="fas fa-filter filter-icon"></i>
                            <select id="categoryFilter" aria-label="Filtrar por categoria">
                                <option value="">Todas as Categorias</option>
                            </select>
                            <i class="fas fa-chevron-down arrow-icon"></i>
                        </div>
                    </div>
                    <button id="exportXmlBtn" class="theme-btn glass-btn" aria-label="Exportar para XML" title="Exportar XML">
                        <i class="fas fa-file-code"></i>
                    </button>
                    <button id="themeToggle" class="theme-btn glass-btn" aria-label="Alternar Tema">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="app-main">
            <div class="overview-section">
                <div class="stat-card glass">
                    <div class="stat-icon-wrapper blue">
                        <i class="fas fa-pills"></i>
                    </div>
                    <div class="stat-details">
                        <span class="stat-label">Total Cadastrado</span>
                        <strong id="totalMedicamentos" class="stat-value">0</strong>
                    </div>
                </div>
                
                <div class="stat-card glass">
                    <div class="stat-icon-wrapper green">
                        <i class="fas fa-layer-group"></i>
                    </div>
                    <div class="stat-details">
                        <span class="stat-label">Categoria Atual</span>
                        <strong id="categoriaAtual" class="stat-value">Todas</strong>
                    </div>
                </div>
            </div>

            <div class="content-area">
                <div class="medicamentos-grid" id="medicamentosContainer">
                    <!-- Medicamentos will be injected here via JS -->
                    <div class="loading-skeleton">
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                    </div>
                </div>

                <div id="noResults" class="no-results hidden">
                    <div class="empty-state glass">
                        <div class="empty-icon">
                            <i class="fas fa-search-minus"></i>
                        </div>
                        <h2>Nenhum resultado encontrado</h2>
                        <p>Tente refinar sua busca com outros termos ou limpe os filtros.</p>
                        <button id="clearSearch" class="btn-primary">Limpar Filtros</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer glass">
            <p>Desenvolvido por Eros Fernandes</p>
            <p style="font-size: 0.8rem; opacity: 0.8; margin-top: 0.2rem;">&copy; 2025 CPD-TI</p>
        </footer>
    </div>

    <!-- Floating UI Elements -->
    <a href="https://wa.me/5589994250078" target="_blank" class="whatsapp-float glass-btn" aria-label="Fale conosco no WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <div id="notification" class="toast glass hidden">
        <div class="toast-icon">
            <i class="fas fa-check"></i>
        </div>
        <div class="toast-message">
            <span>Código Copiado!</span>
            <small>Transferido para a área de transferência</small>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
